name: Build & Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: |
        echo "✅ Backend is ready for deployment"
        npm run lint --if-present || true

    - name: Create deployment artifact
      run: |
        zip -r ailearnemate-${{ github.sha }}.zip . -x "node_modules/*" ".git/*" ".github/*" "coverage/*"

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: ailearnemate-${{ github.sha }}.zip
        retention-days: 30

    - name: Set deployment status
      if: success()
      run: |
        echo "✅ Build successful!"
        echo "Package: ailearnemate-${{ github.sha }}.zip"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: deployment-package

    - name: Deploy to staging
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        echo "🚀 Deploying to staging environment..."
        # This is a placeholder - replace with your actual deployment command
        # Example for Heroku:
        # heroku login
        # heroku git:remote -a your-staging-app
        # git push heroku main
        
        # Example for AWS:
        # aws s3 cp ailearnemate-${{ github.sha }}.zip s3://your-bucket/deployments/
        
        echo "✅ Staging deployment prepared"

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'Staging deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author
      continue-on-error: true

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: deployment-package

    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      run: |
        echo "🚀 Deploying to production..."
        echo "Tag: ${{ github.ref }}"
        
        # Production deployment commands here
        echo "✅ Production deployment prepared"

    - name: Create release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: "Production release ${{ github.ref }}"
        draft: false
        prerelease: false

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'Production deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action
      continue-on-error: true
